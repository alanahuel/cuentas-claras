name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-spa tesseract-ocr-eng
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run pytest -q
        working-directory: backend
      - run: npm ci && npm run test:unit && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start isolated server
        run: |
          export DATA_DIR="$RUNNER_TEMP/portfolio-cuentas-e2e"
          export APP_ORIGIN=http://127.0.0.1:8000
          backend/.venv/bin/python scripts/seed-test.py
          cd backend
          ./.venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/cuentas-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/cuentas-server.pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/health; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/cuentas-server.log"
          exit 1
      - run: npm run test:portfolio
        working-directory: frontend
      - name: Stop isolated server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/cuentas-server.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/cuentas-server.pid")" || true
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: frontend/test-results/
